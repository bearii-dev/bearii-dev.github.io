<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2453D6">
  <title>WayPoint Live</title>
  <style>
    :root { --bg: #f4f6fb; --text: #141a2e; --muted: #5b6478; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0f1d; --text: #eef1fa; --muted: #a3abc0; } }
    html, body { margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: var(--bg); color: var(--text); text-align: center;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    }
    h1 {
      margin: 0 0 8px; font-size: 30px;
      background: linear-gradient(135deg, #2453D6, #7B4DE0); -webkit-background-clip: text;
      background-clip: text; color: transparent;
    }
    p { margin: 0; color: var(--muted); max-width: 420px; }
  </style>
</head>
<body>
  <div>
    <h1>WayPoint Live</h1>
    <p>Real-time location sharing with the people you choose.<br>แชร์ตำแหน่งแบบเรียลไทม์กับคนที่คุณเลือก</p>
    <p style="margin-top:16px"><a href="privacy/" style="color:#4B6BFF">Privacy policy · นโยบายความเป็นส่วนตัว</a></p>
  </div>
</body>
</html>
